name: Verify skill suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned parser and linter
        run: python -m pip install --disable-pip-version-check pypdf==6.13.2 ruff==0.15.21
      - name: Lint Python
        run: ruff check scripts shared plugins tools tests adapters
      - name: Compile Python
        run: python -m compileall -q scripts shared plugins tools tests adapters
      - name: Check generated registry is current
        run: python scripts/build_registry.py
      - name: Validate package and routing cases
        run: python scripts/validate.py
      - name: Run offline unit and mock tests
        run: python -m unittest discover -s tests -q
