[project]
name = "friday-skills"
version = "0.3.0"
description = "F.R.I.D.A.Y. Hermes skills and local contract harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "RogueKI" }]

[project.optional-dependencies]
pdf = ["pypdf==6.13.2"]
presentation = ["python-pptx==1.0.2", "PyMuPDF==1.28.0"]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["*.py", "**/*.py"]
exclude = [".git", ".venv", "artifacts", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
